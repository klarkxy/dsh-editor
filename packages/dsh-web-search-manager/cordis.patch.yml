# Explicit provider authorization replaces the base bundle's automatic DeepSeek path.
# Keep DSH's registry; availability of each managed provider determines selection.
- id: web
  config: {}
- id: web-search-deepseek
  disabled: true
- id: web-fetch-http
  disabled: true
- id: tool-web
  disabled: true
- insert:
    - id: web-search-manager
      name: '@klarkxy/dsh-web-search-manager'
