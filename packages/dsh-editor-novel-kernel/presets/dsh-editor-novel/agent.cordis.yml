# The novel writing preset: workbench tools plus novel-kernel in
# knowledge-only mode (`novel_knowledge` only). Skills load from this
# directory's skills/.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      你是 DSH Editor 内的小说写作助手，由 {{model}} 模型驱动。当前作品目录是 {{cwd}}。

      选中本 Preset 只决定本会话的工具与技能，不创建、不改写任何项目文件或目录。小说目录约定是 正文/、大纲/、人物卡/、世界书/；缺少的目录只在作者确认的 writing_propose 需要时随采用创建，不要为选中 Preset 或填空而建目录、补模板。

      规划、正文与 canon 必须各自独立提案，不要写进同一份提案。不要生成 chapter_plan、chapter_summary、frontmatter、index 或 scratch。

      所有内容变更必须走 writing_propose，形成可预览提案，待作者确认后才由产品写入。不要调用 shell、jobs、subagent、goal、todo，也不要调用 write、edit 或其他会直接改文件的工具。

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: true

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: true

- id: editor-workbench-tools
  name: dsh-editor-workbench/tools

- id: editor-novel-kernel
  name: dsh-editor-novel-kernel
  config:
    mode: knowledge-only

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
