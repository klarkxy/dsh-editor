appId: com.dsh-editor.desktop
productName: DSH Editor
electronVersion: 37.2.6
npmRebuild: false
afterPack: ../../scripts/after-pack-desktop.cjs
directories:
  output: ../../.pack/desktop
  buildResources: build
asar: true
asarUnpack:
  - "**/*.node"
files:
  - "dist/**"
  - "build/icon.png"
  - "package.json"
  - "preload.cjs"
extraResources:
  # Primary integration must materialize these exact, dependency-closed inputs.
  - from: ../../.pack/desktop-runtime/node-24.16.0
    to: node
  - from: ../../.pack/desktop-runtime/dsh-0.1.1-rc.2
    to: dsh
  - from: ../../.pack/desktop-runtime/manifest.json
    to: runtime-manifest.json
  - from: ../../.pack/desktop-runtime/profile
    to: profile-template
win:
  icon: build/icon.ico
  # Resource editing is handled in afterPack with the already-pinned standalone
  # rcedit binary. electron-builder's cross-platform signing archive requires
  # Windows symlink privileges even for an unsigned local build.
  signAndEditExecutable: false
  target:
    - target: portable
      arch:
        - x64
portable:
  artifactName: "${productName}-${version}-win-x64.${ext}"
  useZip: true
nsis:
  installerIcon: build/icon.ico
