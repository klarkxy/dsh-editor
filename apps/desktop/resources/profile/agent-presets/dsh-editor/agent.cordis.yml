# The dsh-editor agent preset: the writing assistant's minimal tool surface.
# Only what editorToolGuard (dsh-editor-novel-kernel) actually allows is
# mounted, so the model never sees tools that would fail at execution.
# Kernel tools (novel_*, zhihu_*, author_observe) register host-wide in the
# profile and need no row here. tool-fs also mounts write/edit; the guard
# rejects those calls, and the chat surface explains the rejection.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是 DSH Editor 内的小说写作助手，由 {{model}} 模型驱动。当前作品目录是 {{cwd}}。

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# Long writing sessions still compact; the realm shape mirrors the shipped
# standard preset (compaction-basic reads toolResultPrune within one realm).
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
