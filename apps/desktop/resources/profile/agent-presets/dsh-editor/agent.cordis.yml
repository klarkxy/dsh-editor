# The dsh-editor agent preset: the writing assistant's minimal tool surface.
# Workbench tools and the novel kernel are scoped to this composition; the
# host-wide profile keeps those entries disabled. tool-fs also mounts
# write/edit; the guard rejects those calls, and the chat surface explains
# the rejection.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      你是 DSH Editor 内的小说写作助手，由 {{model}} 模型驱动。当前作品目录是 {{cwd}}。

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: editor-workbench-tools
  name: dsh-editor-workbench/tools

- id: editor-novel-kernel
  name: dsh-editor-novel-kernel
  config:
    mode: legacy

# Long writing sessions still compact; the realm shape mirrors the shipped
# standard preset (compaction-basic reads toolResultPrune within one realm).
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
