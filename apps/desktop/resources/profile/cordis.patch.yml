# The host's official UI surfaces are taken over by dsh-editor-shell; these
# upstream UI entries are not used on desktop.
- id: ui-sidebar
  disabled: true
# Official plugin manager owns install/inspect/progress/approval/cancel/remove.
# Editor only hosts its public main page and adds search/discovery.
- id: ui-settings-plugin-inventory
  disabled: true
- id: ui-brand-official
  disabled: true
- id: ui-attachment
  disabled: true
- id: ui-tool
  disabled: true
- id: ui-cordis
  disabled: true
- id: ui-workflow-run
  disabled: true
- id: ui-deliverables
  disabled: true
- id: ui-workspace
  disabled: true
- id: ui-input-trigger
  disabled: true
- id: ui-commands
  disabled: true
- id: ui-skill
  disabled: true
- id: ui-subagent
  disabled: true
- id: ui-reference
  disabled: true
- id: ui-jobs
  disabled: true
- id: ui-goal
  disabled: true
- id: ui-message-feedback
  disabled: true
- id: ui-model-selection
  disabled: true
# DSH 0.2.1 adds harness-development prompt context (checkout + GUI URL for an
# agent that inspects the harness itself). It does not belong in a writing app.
- id: harness-dev-context
  disabled: true
# DSH 0.2.1 adds official region-local "More" menus for plugin launchers. The
# editor takes over the layout chrome those regions live in.
- id: entry-customization
  disabled: true
- id: ui-permission
  disabled: true
- id: ui-agent-preset
  disabled: true
- id: ui-settings-plugins
  disabled: true
# The settings dialog shell and the models section are replaced by the
# editor's own paper/ink settings dialog (dsh-editor-shell). ui-settings itself
# stays: it provides the settingsScope/settingsSchema services.
- id: ui-settings-general
  disabled: true
- id: ui-settings-models
  disabled: true
# New in DSH 0.2.0: official settings section for session-log export. The
# editor owns writing-session export routes, so the official section stays out.
- id: ui-settings-session-log
  disabled: true
- id: ui-plan
  disabled: true
# Keep native user-questions enabled: it owns Remote requests and pending
# interactions. The editor renders the resulting carrier in its own card.
- id: ui-trajectory
  disabled: true
# Writing sessions mount the editor's own presets (deployed into
# <dshHome>/.agent-presets by the desktop app) instead of the shipped
# `standard` coding agent. The new default is dsh-editor-writing; the
# historical dsh-editor preset remains selectable.
- id: agent-preset-registry
  config:
    default: dsh-editor-writing

# Scoped writing tools stay resolvable for app-owned presets. The locked
# editor-workbench core still loads host-wide and owns fail-closed guard/RPC.
# editor-novel-kernel likewise stays resolvable for app-owned presets
# (session-scoped mount) while disabled host-wide.
- id: editor-workbench-tools
  disabled: true
- id: editor-novel-kernel
  disabled: true

# Native search is the editor's web story: upstream `web` already resolves the
# DeepSeek official search route and the anonymous HTTP fetch route with the
# shared DEEPSEEK_API_KEY credential, and dsh-web-app also disables tool-web
# host-wide. Keep that guard so only the app-owned presets mount it per scope.
- id: tool-web
  disabled: true

# The Editor exposes document previews; coding surfaces and schedules stay outside this composition.
# Since DSH 0.2.0 the official automation tasks live in an optional bundle outside
# dsh-web-app; these entries stay as a guard so a later automation-bundle install
# cannot light up schedules inside the editor composition.
- id: ui-sidebar-terminal
  disabled: true
- id: ui-sidebar-browser
  disabled: true
- id: ui-schedule
  disabled: true
- id: schedule
  disabled: true

# Editor owns layout and implements the official public layout contract.
- id: ui-layout
  disabled: true
