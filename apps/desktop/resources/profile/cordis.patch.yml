# The host's official UI surfaces are taken over by dsh-editor-shell; these
# upstream UI entries are not used on desktop.
- id: ui-sidebar
  disabled: true
- id: ui-settings-plugin-inventory
  disabled: true
- id: ui-brand-official
  disabled: true
- id: ui-attachment
  disabled: true
- id: ui-tool
  disabled: true
- id: ui-cordis
  disabled: true
- id: ui-workflow-run
  disabled: true
- id: ui-deliverables
  disabled: true
- id: ui-workspace
  disabled: true
- id: ui-input-trigger
  disabled: true
- id: ui-commands
  disabled: true
- id: ui-skill
  disabled: true
- id: ui-subagent
  disabled: true
- id: ui-reference
  disabled: true
- id: ui-jobs
  disabled: true
- id: ui-goal
  disabled: true
- id: ui-message-feedback
  disabled: true
- id: ui-model-selection
  disabled: true
- id: ui-permission
  disabled: true
- id: ui-agent-preset
  disabled: true
- id: ui-settings-plugins
  disabled: true
# The settings dialog shell and the models section are replaced by the
# editor's own paper/ink settings dialog (dsh-editor-shell). ui-settings itself
# stays: it provides the settingsScope/settingsSchema services.
- id: ui-settings-general
  disabled: true
- id: ui-settings-models
  disabled: true
- id: ui-plan
  disabled: true
# The editor Shell renders the question card itself.
- id: ui-user-questions
  disabled: true
- id: ui-trajectory
  disabled: true
# Writing sessions mount the editor's own presets (deployed into
# <dshHome>/.agent-presets by the desktop app) instead of the shipped
# `standard` coding agent. The new default is dsh-editor-writing; the
# historical dsh-editor preset remains selectable.
- id: agent-presets
  config:
    default: dsh-editor-writing

# Desktop proofreading runs through the proofread panel via workbench
# `proofread.scan`, not dsh-proofread's standalone text-check route or dock.
# This entry stays disabled to keep the standalone `/proofread` text.check
# route and dock out of the desktop.
- id: proofread
  disabled: true
# Scoped writing tools stay resolvable for app-owned presets. The locked
# editor-workbench core still loads host-wide and owns fail-closed guard/RPC.
# editor-novel-kernel likewise stays resolvable for app-owned presets
# (session-scoped mount) while disabled host-wide.
- id: editor-workbench-tools
  disabled: true
- id: editor-novel-kernel
  disabled: true
