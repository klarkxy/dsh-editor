name: Publish v0.3.3 bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.3.3-bootstrap.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: '391525995'
      RELEASE_BODY: |
        ## 修复

        - 修复 macOS 发行包中 npm / npx 指向 CI 构建机绝对路径、导致运行时复制失败的问题。
        - 统一 Node、DSH 与 profile-template 的运行时文件树校验，禁止静默漏过符号链接和特殊文件。
        - 修复便携运行时复制失败后的清理竞态，保留最初错误，不再被 ENOTEMPTY 覆盖。

        ## 验证

        - Windows 与 macOS 构建、类型检查和测试均通过。
        - macOS 最终 ZIP 在隔离 HOME / DSH_HOME、无构建机 Node 的环境中通过首次启动冒烟。
        - Windows 便携 EXE 通过最终启动冒烟。
    steps:
      - name: Publish verified release
        shell: bash
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true \
            -f body="${RELEASE_BODY}"
