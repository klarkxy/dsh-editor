name: Desktop runtime regression

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'scripts/**'
      - 'e2e/macos-packaged.mjs'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/desktop-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-package:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      # Use the dependency graph already verified by the frozen workspace lockfile.
      # A global npm install of the same CLI version can resolve newer transitive packages.
      - name: Verify the locked DSH runtime
        run: node --input-type=module -e "import { resolveDshInstallation } from './scripts/dsh-cli.mjs'; console.log(resolveDshInstallation())"
      - name: Build, verify portable materialization and boot the macOS ZIP
        run: pnpm pack:desktop
      - name: Run runtime regression tests
        run: pnpm exec vitest run apps/desktop/test/runtime-packaging.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-runtime-diagnostics
          if-no-files-found: ignore
          path: |
            .pack/macos-e2e/**
            .pack/desktop/verification.json
