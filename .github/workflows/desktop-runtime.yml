name: Desktop runtime regression

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'scripts/**'
      - 'e2e/macos-packaged.mjs'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/desktop-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-package:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install the pinned DSH runtime
        shell: bash
        run: |
          DSH_VERSION=$(node -p "require('node:fs').readFileSync('scripts/dsh-cli.mjs','utf8').match(/EXPECTED_DSH_VERSION = '([^']+)'/)[1]")
          npm install -g "@deepseek-ai/dsh@$DSH_VERSION"
          echo "DSH_CLI_PATH=$(npm root -g)/@deepseek-ai/dsh/lib/bin.js" >> "$GITHUB_ENV"
      - name: Build, verify portable materialization and boot the macOS ZIP
        run: pnpm pack:desktop
      - name: Run runtime regression tests
        run: pnpm exec vitest run apps/desktop/test/runtime-packaging.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-runtime-diagnostics
          if-no-files-found: ignore
          path: |
            .pack/macos-e2e/**
            .pack/desktop/verification.json
