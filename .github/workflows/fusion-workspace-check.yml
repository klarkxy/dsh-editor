name: Fusion workspace check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fusion-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - name: Install exact workspace dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Fusion lifecycle tests
        run: node --experimental-strip-types --test packages/dsh-fusion/test/*.node.mjs
      - name: Workspace validation
        run: pnpm build && pnpm typecheck && pnpm test --maxWorkers=2
