name: Portable learning plugins
on:
  pull_request:
    paths:
      - 'packages/dsh-ai-services/**'
      - 'packages/dsh-memory/**'
      - 'packages/dsh-self-improvement/**'
      - 'e2e/ai-plugins-standalone.mjs'
      - 'scripts/pack-plugins.mjs'
      - 'pnpm-lock.yaml'
      - '.github/workflows/portable-learning.yml'
permissions:
  contents: read
jobs:
  native-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack:plugins
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify exact tarballs in a fresh native Web profile without Editor
        env:
          DSH_CLI_PATH: ${{ github.workspace }}/node_modules/@deepseek-ai/dsh/lib/bin.js
        run: node e2e/ai-plugins-standalone.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-learning-native-web
          path: e2e/out/ai-standalone/
          if-no-files-found: ignore
          retention-days: 7
