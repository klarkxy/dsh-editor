name: Zhihu consumer validation
on:
  push:
    branches: [refactor/consume-external-public-plugins]
    paths: [.github/workflows/zhihu-extraction-once.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: work
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: klarkxy/dsh-plugins
          ref: e3c63192adfafb2b1d42716ec29a0311df4f07f6
          path: migration-tools
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - name: Apply pinned consumer migration and shared-filter regression
        working-directory: work
        run: |
          python3 ../migration-tools/scripts/migrate-zhihu-once.py editor .
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/plugin-manifest.spec.mjs')
          text = p.read_text()
          old = '    expect(prepare).toContain("!normalized.endsWith(\'.map\')")'
          assert text.count(old) == 1
          text = text.replace("import { desktopComposition } from './desktop-compositions.mjs'", "import { desktopComposition } from './desktop-compositions.mjs'\nimport { packageCopyFilter } from './package-copy.mjs'")
          text = text.replace(old, '''    expect(prepare).toContain('filter: packageCopyFilter(source, { omitMaps: true })')
              const source = resolve(root, 'node_modules/@klarkxy/dsh-zhihu')
              const filter = packageCopyFilter(source, { omitMaps: true })
              expect(filter(source)).toBe(true)
              expect(filter(resolve(source, 'lib/client.js'))).toBe(true)
              expect(filter(resolve(source, 'lib/client.js.map'))).toBe(false)
              expect(filter(resolve(source, 'src/client.tsx'))).toBe(false)''')
          p.write_text(text)
          PY
      - name: Refresh and freeze lockfile
        working-directory: work
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile
      - name: Validate boundaries, product build, types, tests and plugin archives
        working-directory: work
        run: |
          set -o pipefail
          {
            node --test scripts/external-plugins.test.mjs scripts/check-ui-drift.test.mjs
            node scripts/check-ui-drift.mjs --base 36eadb6fbae398a12dc21e7b2200dd06e2bf3f7b
            pnpm build
            pnpm typecheck
            pnpm test --maxWorkers=2
            pnpm test:fusion
            pnpm pack:plugins
          } 2>&1 | tee /tmp/zhihu-editor-check.log
      - name: Commit only reviewed migration scope
        working-directory: work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A packages/dsh-zhihu
          git add package.json pnpm-lock.yaml apps/desktop/resources/external-plugins.json tsconfig.base.json vitest.config.ts scripts/client-style-ownership.spec.mjs scripts/public-package-boundaries.spec.mjs scripts/codemod/targets.txt scripts/plugin-manifest.spec.mjs README.md packages/README.md docs/user-guide.md packages/PUBLISHING.md docs/architecture.md docs/public-plugin-migration.md CHANGELOG.md scripts/external-plugins.test.mjs
          git diff --cached --stat
          git commit -m 'refactor: consume Zhihu as pinned offline artifact and move independent tests'
          git push origin HEAD:refactor/consume-external-public-plugins
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zhihu-editor-validation
          path: /tmp/zhihu-editor-check.log
          retention-days: 3
          if-no-files-found: ignore
