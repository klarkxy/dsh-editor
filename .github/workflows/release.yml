name: Release desktop artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach artifacts to (e.g. v0.1.2)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Artifacts are unsigned; skip certificate discovery on the mac runner.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - name: Install the pinned DSH CLI
        shell: bash
        run: |
          DSH_VERSION=$(node -p "require('node:fs').readFileSync('scripts/dsh-cli.mjs','utf8').match(/EXPECTED_DSH_VERSION = '([^']+)'/)[1]")
          npm install -g "@deepseek-ai/dsh@$DSH_VERSION"
          # The npm global bin directory is not guaranteed to stay on PATH for
          # later steps (observed on macos runners); pin the resolver instead.
          PREFIX=$(npm prefix -g)
          if [ "$RUNNER_OS" = "Windows" ]; then
            CLI="$PREFIX/node_modules/@deepseek-ai/dsh/lib/bin.js"
          else
            CLI="$PREFIX/lib/node_modules/@deepseek-ai/dsh/lib/bin.js"
          fi
          echo "DSH_CLI_PATH=$CLI" >> "$GITHUB_ENV"
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types and tests
        run: pnpm typecheck && pnpm test
      - name: Build
        run: pnpm build
      # 桌面 e2e 依赖 prepare-desktop-dev.mjs(Windows junction + win-x64
      # 运行时),按设计只在 Windows 上跑;mac 的打包校验由 pack:desktop 自带。
      - name: Install the test browser
        if: runner.os == 'Windows'
        run: pnpm exec playwright install chromium
      - name: Verify desktop and writing workflows
        if: runner.os == 'Windows'
        run: pnpm test:e2e:desktop && node e2e/core-loop.mjs
      - name: Pack desktop artifacts
        run: pnpm pack:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            .pack/desktop/DSH Editor-*.exe
            .pack/desktop/DSH Editor-*.dmg
            .pack/desktop/DSH Editor-*.zip

  publish:
    needs: pack
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: artifacts
      - name: Upload verified artifacts to the GitHub release
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "DSH Editor ${RELEASE_TAG#v}"
          cd artifacts
          for file in DSH\ Editor-*; do
            [ -f "$file" ] || continue
            dashed="${file// /-}"
            mv "$file" "$dashed"
            gh release upload "$RELEASE_TAG" "$dashed" --clobber
          done
