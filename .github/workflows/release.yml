name: Release desktop artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach artifacts to (e.g. v0.1.2)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Artifacts are unsigned; skip certificate discovery on the mac runner.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - name: Verify the release tag matches the desktop version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/verify-release-version.mjs "$RELEASE_TAG"
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify the locked DSH runtime
        run: node --input-type=module -e "import { resolveDshInstallation } from './scripts/dsh-cli.mjs'; console.log(resolveDshInstallation())"
      # Workspace exports resolve to generated lib/*.d.ts on a fresh checkout.
      - name: Build
        run: pnpm build
      - name: Check types and tests
        # Windows integration tests spawn PowerShell; the production move deadline
        # is 15s, so let assertions observe that result instead of timing out at 5s.
        # Windows + vitest threads can trip libuv fs-event.c assertions; forks + one
        # worker keep the suite isolated from that watcher crash.
        run: pnpm typecheck && pnpm test --pool=forks --maxWorkers=${{ runner.os == 'Windows' && '1' || '2' }} --testTimeout=${{ runner.os == 'Windows' && '20000' || '5000' }}
      # 桌面 e2e 依赖 prepare-desktop-dev.mjs(Windows junction + win-x64
      # 运行时),按设计只在 Windows 上跑;mac 的打包校验由 pack:desktop 自带。
      - name: Install the test browser
        if: runner.os == 'Windows'
        run: pnpm exec playwright install chromium
      - name: Verify desktop and writing workflows
        if: runner.os == 'Windows'
        run: pnpm test:e2e:desktop && node e2e/core-loop.mjs && node e2e/compositions.mjs
      - name: Verify plugin delivery and search settings
        if: runner.os == 'Windows'
        run: pnpm pack:plugins && node e2e/plugin-matrix.mjs && node e2e/missing-private-plugin.mjs && node e2e/web-search-settings.mjs
      - name: Verify AI plugins and writing shortcuts
        if: runner.os == 'Windows'
        run: node e2e/ai-plugins.mjs && node e2e/writing-ai-services.mjs && node e2e/writing-shortcuts.mjs && node e2e/ai-plugins-standalone.mjs
      - name: Pack desktop artifacts
        run: pnpm pack:desktop
      - name: Start the packed portable wrapper
        if: runner.os == 'Windows'
        env:
          DSH_PORTABLE_SMOKE: '1'
        run: pnpm test:e2e:portable
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            .pack/desktop/DSH Editor-*.exe
            .pack/desktop/DSH Editor-*.dmg
            .pack/desktop/DSH Editor-*.zip

  publish:
    needs: pack
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: artifacts
      - name: Upload verified artifacts to the GitHub release
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --draft --title "DSH Editor ${RELEASE_TAG#v}"
          cd artifacts
          for file in DSH\ Editor-*; do
            [ -f "$file" ] || continue
            dashed="${file// /-}"
            mv "$file" "$dashed"
            gh release upload "$RELEASE_TAG" "$dashed" --clobber
          done
          # 应用内更新经第三方镜像下载,按这份校验和验证文件完整性。
          sha256sum DSH-Editor-* > sha256sums.txt
          gh release upload "$RELEASE_TAG" sha256sums.txt --clobber
