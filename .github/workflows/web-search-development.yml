name: Web search development validation
on:
  push:
    branches: [feat/managed-web-search]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/managed-web-search
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - name: Commit only the generated lockfile
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add pnpm-lock.yaml
            git commit -m 'chore(web): lock managed search dependencies'
            git push origin HEAD:feat/managed-web-search
          fi
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
