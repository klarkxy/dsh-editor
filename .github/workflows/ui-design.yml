name: UI design contracts

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'AGENTS.md'
      - '**/AGENTS.md'
      - 'docs/ui-*.md'
      - 'e2e/ui-design*'
      - 'scripts/check-ui-*.mjs'
      - '.github/pull_request_template.md'
      - '.github/workflows/ui-design.yml'
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Git base for incremental style checks'
        required: true
        default: 'origin/main'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - name: Test incremental UI guard
        run: node --test scripts/check-ui-drift.test.mjs
      - name: Prevent new UI style drift
        env:
          UI_STYLE_BASE: ${{ github.event.pull_request.base.sha || inputs.base_ref }}
        run: node scripts/check-ui-drift.mjs --base "$UI_STYLE_BASE" --head HEAD
      - run: pnpm install --frozen-lockfile
      - name: Check design contracts
        run: node --experimental-strip-types scripts/check-ui-design.mjs
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Test real Radix controls and scoped CSS in Chromium
        run: node e2e/ui-design.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-component-fixture-screenshots
          path: .artifacts/ui-design/*.png
          if-no-files-found: ignore
