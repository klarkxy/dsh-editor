name: Learning workspace review
on:
  pull_request:
    paths:
      - '.github/workflows/learning-workspace-review.yml'
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'feat/portable-dream-procedural-learning'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - name: Archive exact CI toolchain for offline verification
        run: |
          mkdir -p /tmp/learning-toolchain/bin
          cp "$(command -v node)" /tmp/learning-toolchain/bin/node
          cp -a "$(dirname "$(dirname "$(realpath "$(command -v pnpm)")")")" /tmp/learning-toolchain/pnpm
          tar -czf /tmp/learning-toolchain.tar.gz -C /tmp learning-toolchain
      - uses: actions/upload-artifact@v4
        with:
          name: learning-toolchain
          path: /tmp/learning-toolchain.tar.gz
          retention-days: 1
