name: Learning workspace review
on:
  pull_request:
    paths:
      - '.github/workflows/learning-workspace-review.yml'
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'feat/portable-dream-procedural-learning'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source for offline review
        run: git archive --format=tar -o /tmp/dsh-editor-source.tar HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: learning-review-source
          path: /tmp/dsh-editor-source.tar
          retention-days: 1
