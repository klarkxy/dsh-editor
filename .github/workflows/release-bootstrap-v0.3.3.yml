name: Release bootstrap v0.3.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-bootstrap-v0.3.3.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_SHA: 5e3eeffa1d4423b2e0193f963f4de97735109f0a
      RELEASE_TAG: v0.3.3
    steps:
      - name: Create release tag
        shell: bash
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${RELEASE_TAG}" \
              -f "sha=${TARGET_SHA}"
          fi
      - name: Dispatch release workflow
        shell: bash
        run: gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref main -f "tag=${RELEASE_TAG}"
