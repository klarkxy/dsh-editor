name: Integrate writing review improvements

# Temporary branch-only execution environment; removed before the PR is merged.
on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: integrate-writing-review
  cancel-in-progress: false

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/writing-review-reference-lookup'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - name: Apply exact, reviewed integration edits
        run: python scripts/absorb-writing-improvements.py
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and verify before committing
        run: pnpm build && pnpm typecheck && pnpm test --maxWorkers=2
      - name: Commit only the verified integration to this feature branch
        env:
          TARGET_BRANCH: feat/writing-review-reference-lookup
        run: |
          git diff --check
          git add packages/dsh-manuscript/src/client/editor-core/editor.tsx packages/dsh-editor-shell/src/client/editor.tsx packages/dsh-editor-shell/src/client/editor-menu.tsx packages/dsh-editor-shell/src/client/root-columns.tsx packages/dsh-editor-shell/src/client/root.tsx packages/dsh-editor-shell/src/i18n/messages.zh.ts packages/dsh-editor-shell/src/i18n/messages.en.ts docs/user-guide.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: integrate word diff, reference lookup and paragraph selection'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
