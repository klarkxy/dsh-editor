name: Editor externalization workbench
on:
  push:
    branches: [refactor/consume-external-public-plugins]
    paths: [.github/workflows/editor-externalization-workbench.yml]
permissions:
  contents: read
jobs:
  migrate:
    if: github.repository == 'klarkxy/dsh-editor' && github.ref == 'refs/heads/refactor/consume-external-public-plugins'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - name: Externalize source ownership
        run: |
          if [ ! -f apps/desktop/resources/external-plugins.json ]; then
            node scripts/externalize-editor-plugins.mjs
          fi
      - name: Resolve already-published exact versions
        run: pnpm install --no-frozen-lockfile
      - name: Commit generated migration only to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add apps/desktop/resources/external-plugins.json docs/public-plugin-migration.md
          if ! git diff --cached --quiet; then
            git commit -m 'refactor: consume nine public plugins as pinned external artifacts'
            git push origin HEAD:refactor/consume-external-public-plugins
          fi
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Integration and boundary tests
        run: pnpm test --maxWorkers=2 && pnpm test:fusion && pnpm test:external-plugins
      - name: Verify repacked offline plugin artifacts
        run: pnpm pack:plugins
      - name: Snapshot resulting tracked source
        if: always()
        run: git archive HEAD > editor-externalized.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-externalized-source
          path: editor-externalized.tar
          retention-days: 3
